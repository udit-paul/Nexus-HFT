<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Nexus Core Gradient (Cyan) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Ask Side Gradient (Red) -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Bid Side Gradient (Green) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Hardware Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Order Book Layers Group -->
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)">
    
    <!-- Level 3: Bids (Bottom Layer - Green) -->
    <polyline points="96,336 256,416 416,336" stroke="url(#greenGrad)"/>

    <!-- Level 2: Asks (Middle Layer - Red) -->
    <polyline points="96,256 256,336 416,256" stroke="url(#redGrad)"/>

    <!-- Level 1: Matching Engine Core (Top Layer - Cyan) -->
    <polygon points="256,96 96,176 256,256 416,176" stroke="url(#cyanGrad)" fill="#00f2fe" fill-opacity="0.05"/>
    
  </g>
</svg>
